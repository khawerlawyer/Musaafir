<style>
/* Layout: Uber-style split — control panel on the left, live route map on the right; stacks map-over-panel on phones. Palette taken from the brand logo: mint-teal (rider/brand) + orange (accent) on navy. */
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --surface-2:#F6F8FB; --ink:#0D1424; --muted:#5A6476; --line:#DDE2EA;
  --brand:#0A8A72; --brand-ink:#FFFFFF; --brand-soft:#DCF5EE; --accent:#F28A1E; --accent-soft:#FDECD8;
  --good:#1E8A4C; --warn:#B9770B; --bad:#C2412D; --good-soft:#E1F3E8; --warn-soft:#FBF0D9; --bad-soft:#FBE3DE;
  --map-bg:#E6EBF1; --map-block:#D9E0E9; --map-road:#FFFFFF; --water:#CDE3EA; --route-dim:#9AA4B3;
  --font-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --font-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#090E19; --surface:#101726; --surface-2:#151D2E; --ink:#E8ECF3; --muted:#949DAE; --line:#232C3E;
  --brand:#2ED8B2; --brand-ink:#04211B; --brand-soft:#123532; --accent:#FFA43A; --accent-soft:#3A2A14;
  --good:#4CC07F; --warn:#E6A63A; --bad:#EE6B55; --good-soft:#143224; --warn-soft:#3A2E14; --bad-soft:#3D1D18;
  --map-bg:#0D1422; --map-block:#131B2B; --map-road:#212B3E; --water:#0D2230; --route-dim:#4C566A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090E19; --surface:#101726; --surface-2:#151D2E; --ink:#E8ECF3; --muted:#949DAE; --line:#232C3E;
  --brand:#2ED8B2; --brand-ink:#04211B; --brand-soft:#123532; --accent:#FFA43A; --accent-soft:#3A2A14;
  --good:#4CC07F; --warn:#E6A63A; --bad:#EE6B55; --good-soft:#143224; --warn-soft:#3A2E14; --bad-soft:#3D1D18;
  --map-bg:#0D1422; --map-block:#131B2B; --map-road:#212B3E; --water:#0D2230; --route-dim:#4C566A; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--font-data);font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:40px;height:40px;border-radius:11px;display:block;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.brand h1{font-family:var(--font-display);font-weight:800;font-size:22px;margin:0;letter-spacing:-.02em}
.brand small{display:block;color:var(--muted);font-size:10.5px;margin-top:-1px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 16px;border-radius:999px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

.app{display:grid;grid-template-columns:minmax(340px,440px) 1fr;gap:0;min-height:calc(100% - 62px)}
.panel{padding:18px 16px 28px;display:flex;flex-direction:column;gap:16px;border-right:1px solid var(--line);background:var(--surface);min-width:0}
.mapwrap{position:relative;min-width:0;background:var(--map-bg);overflow:hidden}
.mapwrap svg{width:100%;height:100%;display:block;min-height:420px}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .mapwrap{order:-1}
  .mapwrap svg{min-height:0;height:300px}
  .panel{border-right:0}
}

h2{font-family:var(--font-display);font-size:24px;margin:0;letter-spacing:-.02em;text-wrap:balance;line-height:1.15}
h3{font-family:var(--font-display);font-size:16px;margin:0 0 8px;letter-spacing:-.01em}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.section{display:flex;flex-direction:column;gap:10px}

/* Rider */
.trip{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:6px 12px;display:grid;grid-template-columns:18px 1fr;column-gap:10px}
.trip .dot{width:10px;height:10px;border-radius:50%;background:var(--ink);margin:16px auto 0}
.trip .sq{width:10px;height:10px;background:var(--accent);margin:16px auto 0}
.trip .line{grid-column:1;width:2px;height:100%;background:var(--line);margin:0 auto}
.trip input{width:100%;border:0;background:transparent;padding:10px 0;font-weight:600}
.trip .sep{grid-column:2;border-top:1px solid var(--line)}
.deadline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:var(--r);background:var(--accent-soft)}
.deadline label{font-weight:600}
.deadline input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;font-family:var(--font-data)}

.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.type{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.type[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.type b{font-size:14px}
.type span{font-size:12px;color:var(--muted)}

.routes{display:flex;flex-direction:column;gap:8px}
.route{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.route[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.route .name{font-weight:700}
.route .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);margin-left:6px;vertical-align:1px}
.route .eta{text-align:right;font-family:var(--font-data);font-weight:600}
.route .sub{grid-column:1/-1;font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

.fare{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.fare-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-size:18px;font-weight:700}
.stepper .val{font-family:var(--font-display);font-size:28px;font-weight:800;min-width:118px;text-align:center;letter-spacing:-.02em}
.split{height:10px;border-radius:999px;overflow:hidden;display:flex;background:var(--line)}
.split i{display:block;height:100%}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px;flex-wrap:wrap}
.legend b{color:var(--ink);font-family:var(--font-data);font-weight:600}
.likely{font-size:13px;padding:8px 10px;border-radius:10px}

.cta{border:0;background:var(--brand);color:var(--brand-ink);padding:15px;border-radius:12px;font-weight:700;font-size:16px;width:100%}
.cta.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.cta-row{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
.status{border-radius:var(--r);padding:14px;background:var(--brand-soft);display:flex;gap:12px;align-items:center}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;flex:none}

/* Driver */
.shift{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.stat .v{font-family:var(--font-data);font-weight:600;font-size:16px;margin-top:2px}
.fatigue{border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:13px}
.meter{flex:1;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px}

.offer{border:2px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface)}
.offer-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#0B1220;color:#F3F5F9;gap:10px;border-bottom:3px solid transparent;border-image:linear-gradient(90deg,var(--brand),var(--accent)) 1}
.offer-head b{font-family:var(--font-display);font-size:17px}
.timer{font-family:var(--font-data);font-weight:600;background:var(--accent);color:#1B1305;border-radius:999px;padding:3px 10px;font-size:13px}
.offer-body{padding:14px;display:flex;flex-direction:column;gap:14px}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.money .k{font-size:12px;color:var(--muted)}
.money .v{font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:-.02em}
.money .hero .v{color:var(--brand);font-size:26px}
.ledger{font-size:13px;border-top:1px dashed var(--line);padding-top:10px;display:grid;grid-template-columns:1fr auto;gap:4px 10px}
.ledger span:nth-child(even){font-family:var(--font-data);text-align:right}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fact{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:13px;min-width:0}
.fact b{display:block;font-size:14px}
.score{display:flex;gap:14px;align-items:center}
.score .ring{width:74px;height:74px;flex:none}
.bars{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.bar{display:grid;grid-template-columns:78px 1fr 30px;align-items:center;gap:8px;font-size:12px}
.bar .track{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.bar .track i{display:block;height:100%}
.bar .n{font-family:var(--font-data);text-align:right}
.risks{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.risk{display:grid;grid-template-columns:4px 1fr;background:var(--surface)}
.risk + .risk{border-top:1px solid var(--line)}
.risk .stripe{background:var(--good)}
.risk.warn .stripe{background:var(--warn)}
.risk.bad .stripe{background:var(--bad)}
.risk div.t{padding:9px 12px;font-size:13px}
.risk div.t b{display:block;font-size:13.5px}
.droutes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.droute{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;text-align:left;font-size:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.droute[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.droute b{font-size:13px}
.mini{display:grid;grid-template-columns:34px 1fr;gap:4px;align-items:center}
.mini .track{height:4px;background:var(--line);border-radius:999px;overflow:hidden}
.mini .track i{display:block;height:100%}
.note{font-size:12px;color:var(--muted);text-align:center}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tool{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px;font-weight:600;font-size:13px}
.tool.sos{background:var(--bad);color:#fff;border-color:var(--bad)}
.settings{display:flex;gap:8px;flex-wrap:wrap;font-size:13px}
.settings label{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.settings input{width:62px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:var(--surface);font-family:var(--font-data)}
details summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}

/* Map overlay */
.map-ctl{position:absolute;top:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.map-legend{position:absolute;left:12px;bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;display:flex;flex-direction:column;gap:4px;max-width:calc(100% - 24px)}
.map-legend span{display:flex;align-items:center;gap:6px}
.sw{width:18px;height:4px;border-radius:2px;display:inline-block}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: no-preference){
  .route,.type,.droute,.seg button{transition:background .15s,border-color .15s,box-shadow .15s}
  .r-active{stroke-dasharray:10 8;animation:dash 1.2s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-18}}
}

.trip-wrap{position:relative}
.locate{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--brand);font-weight:600;font-size:14px;padding:2px 2px;margin-top:-6px;align-self:flex-start}
.locate:hover{text-decoration:underline}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:15;list-style:none;margin:0;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(10,20,40,.16);max-height:320px;overflow:auto}
.sug li[role="option"]{padding:9px 10px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.sug li[role="option"] span{font-size:12.5px;color:var(--muted)}
.sug li[aria-selected="true"],.sug li[role="option"]:hover{background:var(--brand-soft)}
.sug-empty{padding:10px;color:var(--muted);font-size:13px}
.sug-foot{padding:6px 10px 2px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);margin-top:4px}
.mapwrap{min-height:420px}
#gmap{position:absolute;inset:0}
@media (max-width:820px){.mapwrap{min-height:300px}}

/* Header: brand · GPS · account */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.top-right{display:flex;gap:8px;align-items:center;justify-self:end}
.gps-btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:5px 16px 5px 5px;background:#0B1220;color:#F3F5F9;font-weight:600;font-size:14px;box-shadow:0 0 0 2px transparent;background-image:linear-gradient(#0B1220,#0B1220),linear-gradient(90deg,var(--brand),var(--accent));background-origin:border-box;background-clip:padding-box,border-box;border:2px solid transparent}
.gps-btn b{font-family:var(--font-display);font-weight:800}
.gps-btn img{width:30px;height:30px;border-radius:50%}
.gps-btn:hover{filter:brightness(1.15)}
.country{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;font-size:13px;letter-spacing:.06em}
.acct{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 14px;font-weight:600;min-height:38px}
.avatar.sm{width:28px;height:28px;font-size:12px;margin:-2px -8px}
@media (max-width:760px){
  .top{grid-template-columns:1fr auto}
  .gps-btn{grid-column:1/-1;grid-row:2;justify-self:stretch;justify-content:center}
}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.linkbtn{border:0;background:transparent;color:var(--brand);font-weight:600;padding:4px 0;text-align:left;align-self:flex-start}
.linkbtn.danger{color:var(--bad)}
.linkbtn:hover{text-decoration:underline}
.cta:disabled{opacity:.55;cursor:default}
.cta svg{vertical-align:-3px;margin-right:8px}
.gps-cta{background:#0B1220;color:#F3F5F9}
.form{display:flex;flex-direction:column;gap:6px}
.form label{font-size:13px;font-weight:600;color:var(--muted);margin-top:6px}
.form input,.form select{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:11px 12px;font-size:15px;width:100%}
.form .cta{margin-top:10px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.empty b{color:var(--ink);font-size:15px}
.online-toggle{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 16px 8px 8px;font-weight:700;font-size:15px}
.online-toggle .knob{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none}
.online-toggle .knob::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.online-toggle.on{border-color:var(--brand);background:var(--brand-soft)}
.online-toggle.on .knob{background:var(--brand)}
.online-toggle.on .knob::after{left:21px}
.progress{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11.5px;font-weight:600;color:var(--muted)}
.progress li{border-top:4px solid var(--line);padding-top:6px}
.progress li.done{border-color:var(--brand)}
.progress li.now{border-color:var(--accent);color:var(--ink)}
.plate{display:inline-block;margin-top:4px;font-family:var(--font-data);font-weight:600;letter-spacing:.06em;border:1.5px solid var(--ink);border-radius:6px;padding:1px 8px;background:var(--surface)}
@media (prefers-reduced-motion: no-preference){ .online-toggle .knob::after{transition:left .18s} }

/* GPS — a deliberately dark, single-look driving screen */
body.nav-open{overflow:hidden}
.nav{position:fixed;inset:0;z-index:30;background:#0B1220;color:#EEF2F8;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
.nav-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#2ED8B2,#FFA43A) 1}
.nav-bar img{width:34px;height:34px;border-radius:9px}
.nav-bar b{font-family:var(--font-display);font-size:19px;letter-spacing:-.01em;flex:1}
.nav-x{border:0;background:#1A2436;color:#EEF2F8;width:38px;height:38px;border-radius:50%;font-size:16px}
.nav-setup{padding:20px 16px;display:flex;flex-direction:column;gap:12px;max-width:560px;width:100%;margin:0 auto}
.nav-setup h2{color:#fff;font-size:26px}
.nav-input{width:100%;border:1.5px solid #2A3850;background:#121B2B;color:#fff;border-radius:12px;padding:14px;font-size:16px}
.nav .sug{background:#121B2B;border-color:#2A3850}
.nav .sug li[role="option"] span,.nav .sug-foot,.nav .sug-empty{color:#94A2B8}
.nav .sug li[aria-selected="true"],.nav .sug li[role="option"]:hover{background:#173A3A}
.nav .locate,.nav .linkbtn{color:#2ED8B2}
.nav .eyebrow{color:#94A2B8}
.nav .note{color:#94A2B8}
.prefs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prefs button{border:1.5px solid #2A3850;background:#121B2B;color:#EEF2F8;border-radius:12px;padding:12px 6px;font-weight:700}
.prefs button[aria-pressed="true"]{border-color:#2ED8B2;background:#123532}
.nav .cta{background:linear-gradient(90deg,#1FC9A8,#2ED8B2);color:#04211B}
.nav-run{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.nav-instr{display:flex;gap:14px;align-items:center;padding:14px 16px;background:linear-gradient(135deg,#0E7C66,#0A8A72)}
.nav-icon{width:62px;height:62px;flex:none;color:#fff}
.nav-icon svg{width:100%;height:100%}
.nav-txt{min-width:0}
.nav-dist{font-family:var(--font-display);font-weight:800;font-size:34px;line-height:1;color:#fff}
.nav-text{font-size:19px;font-weight:600;margin-top:4px;color:#E9FFF8;text-wrap:balance}
.nav-next{padding:8px 16px;background:#0A5F50;color:#CFF5EA;font-size:14px;font-weight:600}
.nav-map{flex:1;min-height:200px;background:#16202f}
.nav-bottom{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#0B1220;border-top:1px solid #1E2A3E}
.nav-eta{flex:1;display:flex;flex-direction:column}
.nav-eta b{font-family:var(--font-display);font-size:24px;color:#FFA43A}
.nav-eta span{font-size:13px;color:#94A2B8}
.nav-chip{border:1.5px solid #2A3850;background:#121B2B;color:#EEF2F8;border-radius:999px;padding:9px 14px;font-weight:700}
.nav-chip[aria-pressed="true"]{border-color:#FFA43A;color:#FFA43A}
.install{border:1.5px solid #FFA43A;background:transparent;color:#FFA43A;border-radius:12px;padding:12px;font-weight:800}
.nav-end{border:0;background:#E5484D;color:#fff;border-radius:999px;padding:10px 22px;font-weight:800}
</style>

<script>

const GOOGLE_MAPS_KEY = 'AIzaSyCz4fanS5tJ7mMqHw79Xw7EYQ7QUYGLxvE';
const SUPABASE_URL = '';
const SUPABASE_ANON_KEY = '';
const L = window.MARKET;   // country settings: Pakistan or United States (defined in the page)
const REGION = L.region; // address suggestions are limited to this country

/* ---------- Demo places (used when Google Maps isn't loaded) ---------- */
const PLACES = L.places.map(([name,addr,lat,lng])=>({name,addr,lat,lng}));

/* ---------- Route profiles (estimated scores: 0 = no risk, 100 = high) ---------- */
const PROFILES = {
  fast:{ id:'fast', tag:'Fastest', eff:0.9, safety:{day:18,night:28}, wear:20, fatigue:62 },
  fuel:{ id:'fuel', tag:'Fuel saver', eff:1.22, safety:{day:34,night:66}, wear:52, fatigue:30 },
  safe:{ id:'safe', tag:'Safest', eff:1.0, safety:{day:10,night:16}, wear:18, fatigue:44 },

const TAG_NOTES = {
  fast:{ road:'Main roads with a smooth surface.', traffic:'Heavier stop-go traffic. More tiring.' },
  fuel:{ road:'Some rough patches reported on this route.', traffic:'Steadier speed. Least tiring.' },
  safe:{ road:'Well-lit main roads with good surface.', traffic:'Moderate traffic with a few signals.' },
};
const DEMO_SHAPES = {
  fast:'M110 400 C 190 380, 250 320, 300 262 S 440 150, 500 110',
  fuel:'M110 400 C 180 450, 300 450, 380 410 S 470 300, 470 240 S 490 140, 500 110',
  safe:'M110 400 C 140 320, 210 240, 290 215 S 430 180, 500 110',
};
let ROUTES = [];

const TYPES = L.types;
const PLATFORM_FEE = 0.10;      // the platform keeps 10%, flat and shown to both sides
const DEMO_PICKUP_KM = 2.4, DEMO_PICKUP_MIN = 8, WAIT_MIN = 4;
const OFFER_RADIUS_KM = 15;     // drivers see requests whose pickup is within this distance
const _now = new Date();
const NOW = { h:_now.getHours(), m:_now.getMinutes() };
const _dl = new Date(_now.getTime()+60*60000);
const DEFAULT_DEADLINE = `${String(_dl.getHours()).padStart(2,'0')}:${String(_dl.getMinutes()).padStart(2,'0')}`;

const S = {
  mode:'rider', route:'safe', type:'ac', offer:null, deadline:DEFAULT_DEADLINE, night:false, hazards:true, traffic:true,
  from:PLACES[0], to:PLACES[1], loading:false,
  petrol:L.fuelPerLitre, kmpl:L.defaultKmpl, wearPerKm:L.wearPerKm,
  // demo-only
  driven:370, earned:6820, requested:false, accepted:false, timer:45,
  // live (Supabase)
  backend:false, user:null, profile:null, driver:null, view:null, authStep:'email', authEmail:'', afterAuth:null,
  ride:null, rideDriver:null, rideEnded:null,
  online:false, here:null, offers:[], offerIdx:0, declined:new Set(), job:null, jobRider:null, today:{ net:0, trips:0 },
  busy:false,
};
let G = null;     // Google Maps handles once loaded
let sb = null;    // Supabase client once configured
const CH = {};    // live channels

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pkr = n => L.money(n);
const dist = (km, d=1) => L.dist(km, d);
const r10 = n => Math.round(n/10)*10;
const route = () => ROUTES.find(r=>r.id===S.route) || ROUTES[0];
const type = (id=S.type) => TYPES.find(t=>t.id===id) || TYPES[2];
const clockAt = d => d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
const clock = add => clockAt(new Date(Date.now()+add*60000));
const deadlineMin = () => { const [h,m]=S.deadline.split(':').map(Number); const n=new Date(); return h*60+m-(n.getHours()*60+n.getMinutes()); };
const lvl = v => v<34?'good':v<60?'warn':'bad';
const lvlWord = v => v<34?'Low':v<60?'Medium':'High';
const color = v => `var(--${lvl(v)})`;
const shortName = (n,len=30) => { n=String(n||''); return esc(n.length>len ? n.slice(0,len-2)+'…' : n); };
const short = p => shortName(p?.name);
const isAirport = name => /airport/i.test(name||'');
const initials = n => String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
function fairFare(r=route(), t=type()){ return L.roundFare(t.base + t.km*r.km + t.min*r.min); }
function safetyRisk(r){ return S.night ? r.safety.night : r.safety.day; }
function econ(r=route(), o={}){
  const t = type(o.vehicle||S.type);
  const kmpl = o.kmpl || (t.id==='ac' ? S.kmpl : t.kmpl);
  const fare = o.fare ?? S.offer ?? fairFare(r, t);
  const pickupKm = o.pickupKm ?? DEMO_PICKUP_KM, pickupMin = o.pickupMin ?? DEMO_PICKUP_MIN;
  const fee = fare*PLATFORM_FEE, keep = fare-fee;
  const totalKm = r.km + pickupKm;
  const litres = totalKm/(kmpl*r.eff);
  const fuel = litres*S.petrol, wear = totalKm*S.wearPerKm;
  const net = keep-fuel-wear, mins = r.min+pickupMin;
  return { fare, fee, keep, litres, fuel, wear, net, mins, pickupKm, pickupMin, perHr: net/Math.max(1,mins)*60 };
}
function quality(r, e){
  const earn = Math.max(0, Math.min(100, (e.perHr-L.earnLo)/(L.earnHi-L.earnLo)*100));   // net per hour mapped to 0–100
  const safe = 100-safetyRisk(r), car = 100-r.wear, rest = 100-r.fatigue;
  return { earn:Math.round(earn), safe, car, rest, total:Math.round(earn*.35+safe*.3+car*.2+rest*.15) };
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,3200); }
function haversine(a,b){ const R=6371, toR=x=>x*Math.PI/180; const dLat=toR(b.lat-a.lat), dLng=toR(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
const roadKm = (a,b) => haversine(a,b)*1.3;          // rough road distance from straight-line
const roadMin = km => Math.max(2, Math.round(km/24*60)); // city average ~24 km/h
const ll = p => ({ lat: typeof p.lat==='function'?p.lat():p.lat, lng: typeof p.lng==='function'?p.lng():p.lng });
function bearing(a,b){ const toR=x=>x*Math.PI/180, toD=x=>x*180/Math.PI;
  const y=Math.sin(toR(b.lng-a.lng))*Math.cos(toR(b.lat)); const x=Math.cos(toR(a.lat))*Math.sin(toR(b.lat))-Math.sin(toR(a.lat))*Math.cos(toR(b.lat))*Math.cos(toR(b.lng-a.lng));
  return (toD(Math.atan2(y,x))+360)%360; }
function rideRoute(ride){ // turn a stored ride into a route-like object for the scoring functions
  return { ...PROFILES[ride.route_tag||'safe'], km:+ride.distance_km, min:ride.duration_min, hazards:[], notes:TAG_NOTES[ride.route_tag||'safe'], name:PROFILES[ride.route_tag||'safe'].tag+' route' };
}

/* ---------- Routes for the rider planner ---------- */
function demoRoutes(){
  const isDefault = S.from.name===PLACES[0].name && S.to.name===PLACES[1].name;
  if(isDefault) return L.demoRoutes.map(r=>({ ...PROFILES[r.id], ...r }));
  const d = Math.max(1, haversine(S.from,S.to));
  const mk = (p,name,f,speed) => { const km=+(d*f).toFixed(1); return { ...p, name, km, min:Math.max(4,Math.round(km/speed*60)), hazards:[], notes:TAG_NOTES[p.id] }; };
  return [ mk(PROFILES.fast,'Main-road route',1.25,33), mk(PROFILES.fuel,'Bypass route',1.42,36), mk(PROFILES.safe,'Well-lit route',1.32,32) ];
}
async function googleCompute(origin, destination, extraFields=[]){
  const req = { origin, destination, travelMode:'DRIVING', computeAlternativeRoutes:true,
    fields:['path','viewport','routeLabels','distanceMeters','durationMillis',...extraFields] };
  try{ return (await G.Route.computeRoutes({ ...req, routingPreference:'TRAFFIC_AWARE', departureTime:new Date() })).routes || []; }
  catch(e){ return (await G.Route.computeRoutes(req)).routes || []; }
}
function profileRoutes(routes){
  const list = routes.map((g,i)=>({ g, i, km:+(g.distanceMeters/1000).toFixed(1), min:Math.max(1,Math.round((g.durationMillis||0)/60000)) }));
  const byTime = [...list].sort((a,b)=>a.min-b.min);
  const picks = { fast:byTime[0] };
  const rest = list.filter(x=>x!==picks.fast).sort((a,b)=>a.km-b.km);
  if(rest[0]) picks.fuel = rest[0];
  if(rest[1]) picks.safe = rest[1];
  return Object.entries(picks).map(([id,x])=>{
    const speed = x.km/(x.min/60);
    const eff = speed>45?1.15:speed<22?0.85:1.0;
    const fatigue = Math.round(Math.max(20,Math.min(75, 90-speed*1.3)));
    return { ...PROFILES[id], eff, fatigue, name:`Route ${x.i+1} · ${dist(x.km)}`, km:x.km, min:x.min, hazards:[], g:x.g,
      notes:{ road:`Average speed ${L.speed(speed)}. Road-hazard reports for this route aren't connected yet.`,
              traffic: speed<22?'Heavy stop-go traffic. More tiring.':speed>45?'Mostly free-flowing. Least tiring.':'Moderate traffic.' } };
  });
}
async function computeRoutes(){
  if(G){
    S.loading = true; render();
    try{
      const routes = await googleCompute({lat:S.from.lat,lng:S.from.lng}, {lat:S.to.lat,lng:S.to.lng});
      if(!routes.length) throw new Error('No driving route found');
      ROUTES = profileRoutes(routes);
    }catch(e){ console.error('Google routes failed:', e); ROUTES = demoRoutes(); toast('Google routes failed: ' + (e?.message||'').slice(0,120) + '. Showing estimates.'); }
    S.loading = false; G.fit = true;
  } else ROUTES = demoRoutes();
  if(!ROUTES.some(r=>r.id===S.route)) S.route = ROUTES[0].id;
}

/* ---------- Address search (shared by rider form and GPS) ---------- */
async function suggest(q){
  if(G){
    try{
      if(!G.token) G.token = new G.AutocompleteSessionToken();
      const req = { input:q, sessionToken:G.token };
      if(REGION) req.includedRegionCodes = [REGION];
      const bias = S.here || G.here;
      if(bias) req.locationBias = { center:bias, radius:50000 };
      const { suggestions } = await G.AutocompleteSuggestion.fetchAutocompleteSuggestions(req);
      return suggestions.filter(s=>s.placePrediction).slice(0,6).map(s=>({ label:s.placePrediction.text.toString(), pred:s.placePrediction }));
    }catch(e){
      console.error('Google address search failed:', e);
      toast('Google address search failed: ' + (e?.message||'unknown error').slice(0,140));
      return [];
    }
  }
  const t = q.trim().toLowerCase();
  return PLACES.filter(p=>(p.name+' '+p.addr).toLowerCase().includes(t)).slice(0,6).map(p=>({ label:p.name, sub:p.addr, place:p }));
}
async function resolvePlace(item){
  if(item.place) return item.place;
  const place = item.pred.toPlace();
  await place.fetchFields({ fields:['displayName','formattedAddress','location'] });
  G.token = null;
  return { name:place.displayName||item.label, addr:place.formattedAddress||'', lat:place.location.lat(), lng:place.location.lng() };
}
// Wire an input to a suggestion list. onPick(place) gets the chosen place; current() restores the text on blur.
function wireAuto(inputId, listId, onPick, current){
  const input = $('#'+inputId), list = $('#'+listId); if(!input||!list) return;
  let items = [], active = -1, debounce;
  const close = () => { list.hidden = true; input.setAttribute('aria-expanded','false'); active=-1; };
  const choose = async it => { input.value = it.label; close();
    try{ onPick(await resolvePlace(it)); }catch(e){ toast('Couldn\'t load that address. Try another one.'); } };
  const draw = () => {
    list.innerHTML = (items.length ? items.map((it,i)=>`<li role="option" id="${listId}-o${i}" aria-selected="${i===active}" data-i="${i}"><b>${esc(it.label)}</b>${it.sub?`<span>${esc(it.sub)}</span>`:''}</li>`).join('')
      : `<li class="sug-empty">No matching places</li>`)
      + (G ? '<li class="sug-foot">Suggestions by Google</li>' : '<li class="sug-foot">Demo places · Google suggestions turn on with your API key</li>');
    list.hidden = false; list.dataset.owner = inputId; input.setAttribute('aria-expanded','true');
    list.querySelectorAll('[data-i]').forEach(li=>li.onmousedown=ev=>{ ev.preventDefault(); choose(items[+li.dataset.i]); });
  };
  input.addEventListener('focus',()=>input.select());
  input.addEventListener('input',()=>{ clearTimeout(debounce); const q=input.value;
    if(q.trim().length<2){ close(); return; }
    debounce = setTimeout(async()=>{ items = await suggest(q); if(input.value===q){ active = items.length?0:-1; draw(); } }, 180); });
  input.addEventListener('keydown',ev=>{
    if(list.hidden) return;
    if(ev.key==='ArrowDown'){ ev.preventDefault(); active=Math.min(items.length-1,active+1); draw(); }
    else if(ev.key==='ArrowUp'){ ev.preventDefault(); active=Math.max(0,active-1); draw(); }
    else if(ev.key==='Enter' && items[active]){ ev.preventDefault(); choose(items[active]); }
    else if(ev.key==='Escape'){ close(); input.value=current(); }
  });
  input.addEventListener('blur',()=>setTimeout(()=>{ if(list.dataset.owner===inputId) close(); if(document.activeElement!==input && current()!==null) input.value=current(); },150));
}
async function pickTrip(field, place){
  S[field] = place; S.offer = null; S.requested = false;
  await computeRoutes(); render();
}

/* ---------- Location ---------- */
function getPosition(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation) return rej(new Error('This browser can\'t share your location.'));
    navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),
      err=>rej(new Error(err.code===1?'Location access was blocked. Allow it in your browser settings.':'Couldn\'t get your location.')),
      { enableHighAccuracy:true, timeout:12000 });
  });
}
async function reverseName(pos){
  if(!G) return { name:'Current location', addr:'' };
  try{
    const { Geocoder } = await google.maps.importLibrary('geocoding');
    const { results } = await new Geocoder().geocode({ location:pos });
    if(results?.[0]){ const addr=results[0].formatted_address; return { name:addr.split(',').slice(0,2).join(',').trim(), addr }; }
  }catch(e){}
  return { name:'Current location', addr:'' };
}
async function useMyLocation(){
  toast('Finding your location…');
  try{
    const pos = await getPosition(); S.here = pos;
    const n = await reverseName(pos);
    await pickTrip('from', { ...n, ...pos }); toast('Pickup set to your location');
  }catch(e){ toast(e.message); }
}

/* =========================================================
   SUPABASE: accounts, rides, live tracking
   ========================================================= */
async function initBackend(){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY) return;
  if(!window.supabase?.createClient){ toast(`Couldn't load the ${L.brand} account service. Check your connection.`); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  S.backend = true;
  const { data:{ session } } = await sb.auth.getSession();
  await onSession(session);
  sb.auth.onAuthStateChange((_e, session)=>{ setTimeout(()=>onSession(session), 0); });
}
async function onSession(session){
  const uid = session?.user?.id || null;
  if(uid && S.user?.id===uid) return;
  Object.values(CH).forEach(c=>sb.removeChannel(c)); for(const k in CH) delete CH[k];
  stopOnline(true);
  Object.assign(S, { user:session?.user||null, profile:null, driver:null, ride:null, rideDriver:null, job:null, jobRider:null, offers:[] });
  if(uid){
    const [{ data:profile }, { data:driver }] = await Promise.all([
      sb.from('profiles').select('*').eq('id',uid).maybeSingle(),
      sb.from('drivers').select('*').eq('id',uid).maybeSingle() ]);
    S.profile = profile; S.driver = driver;
    if(!profile){ S.view='auth'; S.authStep='profile'; }
    else if(S.view==='auth'){ S.view=null; if(S.afterAuth==='request'){ S.afterAuth=null; render(); return requestRide(); } }
    await loadRiderRide();
    if(driver?.status==='approved'){ await loadDriverJob(); loadToday(); subscribeOffers(); }
  }
  if(!S.driver) S.mode='rider';
  render();
}
async function sendCode(email){
  S.busy=true; render();

  S.busy=false;
  if(error){ toast(error.message); render(); return; }
  S.authEmail = email; S.authStep='code'; render(); toast('Check your email for the code');
}
async function verifyCode(code){
  S.busy=true; render();
  const { error } = await sb.auth.verifyOtp({ email:S.authEmail, token:code.trim(), type:'email' });
  S.busy=false;
  if(error){ toast(error.message); render(); }
}
async function saveProfile(name, phone){
  S.busy=true; render();
  const { data, error } = await sb.from('profiles').insert({ id:S.user.id, full_name:name.trim(), phone:phone.trim()||null }).select().single();
  S.busy=false;
  if(error){ toast(error.message); render(); return; }
  S.profile = data; S.view = null; toast(`Welcome to ${L.brand}, ${data.full_name.split(' ')[0]}`);
  if(S.afterAuth==='request'){ S.afterAuth=null; render(); return requestRide(); }
  render();
}
async function registerDriver(f){
  S.busy=true; render();
  const { data, error } = await sb.from('drivers').insert({ id:S.user.id, vehicle_type:f.type, vehicle_make:f.make.trim(), vehicle_color:f.color.trim()||null, plate:f.plate.trim().toUpperCase(), km_per_litre:L.economyToKmpl(+f.kmpl)||L.defaultKmpl }).select().single();
  S.busy=false;
  if(error){ toast(error.message); render(); return; }
  S.driver = data; S.view = null; S.mode='driver'; toast('Application sent. We\'ll review your vehicle details.'); render();
}

/* ----- Rider side ----- */
async function loadRiderRide(){
  const { data } = await sb.from('rides').select('*').eq('rider_id',S.user.id).in('status',['requested','accepted','arrived','in_progress']).order('created_at',{ascending:false}).limit(1).maybeSingle();
  S.ride = data || null;
  if(S.ride){ watchRide(S.ride); if(S.ride.driver_id) loadRideDriver(); }
}
async function requestRide(){
  if(!S.backend){ S.requested=true; render(); toast(`Demo: ${L.demo.driverFirst} accepted your ride`); return; }
  if(!S.user || !S.profile){ S.afterAuth='request'; S.view='auth'; if(!S.user) S.authStep='email'; render(); return; }
  const r = route(), fare = S.offer ?? fairFare();
  S.busy = true; render();
  const { data, error } = await sb.from('rides').insert({
    rider_id:S.user.id, vehicle_type:S.type, route_tag:r.id, distance_km:r.km, duration_min:r.min, fare, fair_fare:fairFare(), arrive_by:S.deadline,
    pickup_name:S.from.name, pickup_lat:S.from.lat, pickup_lng:S.from.lng, drop_name:S.to.name, drop_lat:S.to.lat, drop_lng:S.to.lng,
  }).select().single();
  S.busy = false;
  if(error){ toast(error.message.includes('row-level') ? 'You already have an active ride.' : error.message); render(); return; }
  S.ride = data; S.rideEnded = null; watchRide(data); render(); toast('Request sent to drivers nearby');
}
function watchRide(ride){
  if(CH.ride) sb.removeChannel(CH.ride);
  CH.ride = sb.channel('ride-'+ride.id)
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'rides', filter:`id=eq.${ride.id}` }, ({ new:r })=>{
      const prev = S.ride?.status; S.ride = r;
      if(r.driver_id && !S.rideDriver) loadRideDriver();
      if(r.status!==prev){
        if(r.status==='accepted') toast('A driver accepted your ride');
        if(r.status==='arrived') toast('Your driver has arrived');
        if(r.status==='in_progress') toast('Trip started');
        if(r.status==='completed' || r.status==='cancelled'){ endRiderRide(r); return; }
      }
      render();
    }).subscribe();
}
async function loadRideDriver(){
  const { data } = await sb.from('drivers').select('*, profile:profiles(full_name, phone)').eq('id',S.ride.driver_id).maybeSingle();
  if(!data) return;
  S.rideDriver = data; render();
  if(CH.car) sb.removeChannel(CH.car);
  CH.car = sb.channel('car-'+data.id)
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'drivers', filter:`id=eq.${data.id}` }, ({ new:d })=>{
      Object.assign(S.rideDriver, { lat:d.lat, lng:d.lng, heading:d.heading, location_updated_at:d.location_updated_at });
      moveCar(); updateRideEta();
    }).subscribe();
}
function endRiderRide(r){
  S.rideEnded = r; S.ride = null; S.rideDriver = null;
  ['ride','car'].forEach(k=>{ if(CH[k]){ sb.removeChannel(CH[k]); delete CH[k]; } });
  render();
}
async function cancelRide(id){
  const { error } = await sb.rpc('update_ride_status', { p_ride:id, p_status:'cancelled' });
  if(error) toast(error.message);
}

/* ----- Driver side ----- */
async function loadToday(){
  const start = new Date(); start.setHours(0,0,0,0);
  const { data } = await sb.from('rides').select('fare').eq('driver_id',S.user.id).eq('status','completed').gte('completed_at', start.toISOString());
  S.today = { trips:(data||[]).length, net:(data||[]).reduce((s,r)=>s+r.fare*(1-PLATFORM_FEE),0) };
  render();
}
function subscribeOffers(){
  if(CH.offers) sb.removeChannel(CH.offers);
  let t; const refresh = ()=>{ clearTimeout(t); t=setTimeout(refreshOffers, 300); };
  CH.offers = sb.channel('offers').on('postgres_changes', { event:'*', schema:'public', table:'rides' }, refresh).subscribe();
  refreshOffers();
}
async function refreshOffers(){
  if(!S.driver || S.driver.status!=='approved') return;
  const since = new Date(Date.now()-20*60000).toISOString();
  const { data, error } = await sb.from('rides').select('*, rider:profiles!rides_rider_id_fkey(full_name)')
    .eq('status','requested').eq('vehicle_type', S.driver.vehicle_type).gte('created_at', since).order('created_at');
  if(error){ console.error(error); return; }
  S.offers = (data||[]).filter(r=>!S.declined.has(r.id) && (!S.here || haversine(S.here,{lat:r.pickup_lat,lng:r.pickup_lng})<=OFFER_RADIUS_KM));
  if(S.offerIdx>=S.offers.length) S.offerIdx=0;
  if(S.mode==='driver') render();
}
async function loadDriverJob(){
  const { data } = await sb.from('rides').select('*, rider:profiles!rides_rider_id_fkey(full_name, phone)').eq('driver_id',S.user.id).in('status',['accepted','arrived','in_progress']).limit(1).maybeSingle();
  S.job = data || null; if(S.job) watchJob(S.job);
}
function watchJob(job){
  if(CH.job) sb.removeChannel(CH.job);
  CH.job = sb.channel('job-'+job.id)
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'rides', filter:`id=eq.${job.id}` }, ({ new:r })=>{
      if(r.status==='cancelled'){ toast('The rider cancelled this ride'); S.job=null; sb.removeChannel(CH.job); delete CH.job; render(); return; }
      S.job = { ...S.job, ...r }; render();
    }).subscribe();
}
async function acceptOffer(ride){
  S.busy=true; render();
  const { data, error } = await sb.rpc('accept_ride', { p_ride:ride.id });
  S.busy=false;
  if(error){ toast(error.message); refreshOffers(); render(); return; }
  S.job = { ...data, rider:ride.rider }; watchJob(S.job); S.offers=[]; render();
  toast('Ride accepted. Tap Navigate to pickup.');
}
async function jobStep(status){
  S.busy=true; render();
  const { data, error } = await sb.rpc('update_ride_status', { p_ride:S.job.id, p_status:status });
  S.busy=false;
  if(error){ toast(error.message); render(); return; }
  if(status==='completed'){ const net=data.fare*(1-PLATFORM_FEE); toast(`Trip complete. Collect ${pkr(data.fare)} · you keep ${pkr(net)}`); S.job=null; if(CH.job){ sb.removeChannel(CH.job); delete CH.job; } loadToday(); refreshOffers(); }
  else if(status==='cancelled'){ toast('Ride cancelled'); S.job=null; if(CH.job){ sb.removeChannel(CH.job); delete CH.job; } refreshOffers(); }
  else S.job = { ...S.job, ...data };
  render();
}
let watchId=null, lastSent=0, lastPos=null;
async function goOnline(){
  if(!navigator.geolocation){ toast('This browser can\'t share your location.'); return; }
  S.online = true; render();
  watchId = navigator.geolocation.watchPosition(async p=>{
    const pos = { lat:p.coords.latitude, lng:p.coords.longitude };
    const heading = Number.isFinite(p.coords.heading) ? p.coords.heading : (lastPos && haversine(lastPos,pos)>0.005 ? bearing(lastPos,pos) : null);
    lastPos = pos; S.here = pos;
    if(Date.now()-lastSent > 4000){
      lastSent = Date.now();
      const { error } = await sb.from('drivers').update({ online:true, lat:pos.lat, lng:pos.lng, heading, location_updated_at:new Date().toISOString() }).eq('id',S.user.id);
      if(error) console.error(error);
    }
    moveSelf(pos, heading);
  }, err=>{ toast(err.code===1?'Location access is needed to go online. Allow it in your browser settings.':'Lost your location signal.'); if(err.code===1) stopOnline(); },
  { enableHighAccuracy:true, maximumAge:3000, timeout:20000 });
  refreshOffers(); toast('You\'re online. New ride offers will appear here.');
}
async function stopOnline(silent){
  if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
  const was = S.online; S.online = false;
  if(was && sb && S.user) await sb.from('drivers').update({ online:false }).eq('id',S.user.id);
  if(was && !silent){ toast('You\'re offline'); render(); }
}

function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
const CAR_PATH = 'M0,-14 L9,10 L0,5 L-9,10 Z';
function carIcon(heading, fill){ return { path:CAR_PATH, fillColor:fill||cssVar('--brand'), fillOpacity:1, strokeColor:'#ffffff', strokeWeight:2, scale:1.3, rotation:heading||0, anchor:new google.maps.Point(0,0) }; }
function dotIcon(fill){ return { path:google.maps.SymbolPath.CIRCLE, scale:8, fillColor:fill, fillOpacity:1, strokeColor:'#ffffff', strokeWeight:3 }; }
function animateMarker(marker, to, ms=900){
  const from = marker.getPosition(); if(!from){ marker.setPosition(to); return; }
  const a = { lat:from.lat(), lng:from.lng() }, t0 = performance.now();
  cancelAnimationFrame(marker._raf);
  const step = now => { const k=Math.min(1,(now-t0)/ms); marker.setPosition({ lat:a.lat+(to.lat-a.lat)*k, lng:a.lng+(to.lng-a.lng)*k }); if(k<1) marker._raf=requestAnimationFrame(step); };
  marker._raf = requestAnimationFrame(step);
}
function clearGoogle(){ G.lines.forEach(l=>l.setMap(null)); G.marks.forEach(m=>m.setMap(null)); G.lines=[]; G.marks=[]; }
function renderGoogleMap(){
  clearGoogle();
  const live = S.mode==='rider' ? S.ride : S.mode==='driver' ? S.job : null;
  if(live){
    const pu = { lat:live.pickup_lat, lng:live.pickup_lng }, dr = { lat:live.drop_lat, lng:live.drop_lng };
    G.marks.push(new google.maps.Marker({ map:G.map, position:pu, title:live.pickup_name, icon:dotIcon('#0D1424') }));
    G.marks.push(new google.maps.Marker({ map:G.map, position:dr, title:live.drop_name, icon:dotIcon(cssVar('--accent')) }));
    const bounds = new google.maps.LatLngBounds(); bounds.extend(pu); bounds.extend(dr);
    const car = S.mode==='rider' ? (S.rideDriver?.lat!=null ? { lat:S.rideDriver.lat, lng:S.rideDriver.lng } : null) : S.here;
    if(car) bounds.extend(car);
    if(G.fitLive!==live.id+live.status){ G.map.fitBounds(bounds, 70); G.fitLive=live.id+live.status; }
    moveCar(); moveSelf(S.here);
    return;
  }
  G.fitLive = null;
  const sel = route();
  const order = [...ROUTES].sort((a,b)=>(a.id===S.route)-(b.id===S.route));
  order.forEach(r=>{
    if(!r.g) return;
    const on = r.id===S.route;
    const line = new google.maps.Polyline({ map:G.map, path:(r.g.path||[]).map(ll), strokeColor:on?cssVar('--brand'):'#8C96A8', strokeOpacity:on?1:.6, strokeWeight:on?7:5, zIndex:on?2:1 });
    line.addListener('click',()=>{ S.route=r.id; S.offer=null; render(); });
    G.lines.push(line);
  });
  G.marks.push(new google.maps.Marker({ map:G.map, position:{lat:S.from.lat,lng:S.from.lng}, title:S.from.name, icon:dotIcon('#0D1424') }),
               new google.maps.Marker({ map:G.map, position:{lat:S.to.lat,lng:S.to.lng}, title:S.to.name, icon:dotIcon(cssVar('--accent')) }));
  if(S.mode==='driver' && S.here) moveSelf(S.here);
  if(G.fit && sel?.g?.viewport){ G.map.fitBounds(sel.g.viewport, 60); G.fit=false; }
}
function moveCar(){

function driverOfferCard({ r, e, q, risks, title, timer, riderLine, pickupName, dropName, acceptLabel, extra='' }){

            <label for="kmpl">${L.economyLabel} <input id="kmpl" type="number" value="${L.economyShow(S.kmpl)}"></label>
          </div>

        <div class="facts">

          </div>

        ${extra}
        <div class="cta-row"><button class="cta ghost" id="decline">Decline</button><button class="cta" id="accept" ${S.busy?'disabled':''}>${acceptLabel}</button></div>

function risksFor(r, dropName, riderLine){
  const sr = safetyRisk(r), air = isAirport(dropName);
  const unlitNight = S.night && r.hazards?.some(h=>h.unlit);
  return [
    { lvl: lvl(sr), t:`Personal safety · ${lvlWord(sr)}`, d: unlitNight ? `Unlit ${dist(2.1)} stretch after dark. Keep doors locked and share your trip.`
        : r.id==='safe' ? `Busy, well-lit roads.${air?' Airport drop zone has security.':''}` : `Main roads with steady traffic.${air?' Airport drop zone has security.':''}` },
    { lvl: lvl(r.wear), t:`Car wear · ${lvlWord(r.wear)}`, d: r.notes.road },
    { lvl: lvl(r.fatigue), t:`Fatigue · ${lvlWord(r.fatigue)}`, d: r.notes.traffic },
    riderLine,
    air ? { lvl:'good', t:'Trip back · Good demand', d:'Airports have steady pickups. Expect a short wait for your next ride.' }
        : { lvl:'warn', t:'Trip back · Average demand', d:`Fewer pickups near ${shortName(dropName)}. You may wait longer for your next ride.` },
  ];
}
function fatigueBlock(drivenMin, addMin){
  const after = drivenMin + addMin, limit = 480, pct = Math.min(100, after/limit*100);
  const fat = after>=440?'bad':after>=380?'warn':'good';
  const msg = after>=440 ? `This trip takes you to ${Math.floor(after/60)}h ${after%60}m today. Take a 20-min break after drop-off.`
    : after>=380 ? `You'll be at ${Math.floor(after/60)}h ${after%60}m after this trip. A short break after drop-off is recommended.`
    : `You're fresh. ${Math.floor((limit-after)/60)}h ${(limit-after)%60}m of safe driving left today.`;
  return `<div class="fatigue" style="background:var(--${fat}-soft)"><div style="flex:1"><b style="color:var(--${fat})">Fatigue check</b><div style="font-size:13px">${msg}</div>
    <div class="meter" style="margin-top:6px"><i style="width:${pct}%;background:var(--${fat})"></i></div></div></div>`;
}
const safetyTools = `<div class="section"><span class="eyebrow">Safety tools</span><div class="tools"><button class="tool sos" id="sos">SOS</button><button class="tool" id="share">Share live trip</button><button class="tool" id="checkin">Safety check-in</button></div></div>`;

      pickupName:short(S.from), dropName:short(S.to), acceptLabel:`Accept · ${pkr(e.net)} net`,

      <div class="stat"><div class="k">Trips</div><div class="v">9</div></div>

    const fairNote = o.fair_fare ? (o.fare>=o.fair_fare ? `Offered ${pkr(o.fare)}, at or above the fair fare.` : `Offered ${pkr(o.fare)}, below the fair fare of ${pkr(o.fair_fare)}.`) : '';
    body = (S.offers.length>1?`<div class="row-between"><span class="eyebrow">Offer ${S.offerIdx+1} of ${S.offers.length}</span><span><button class="chip" id="prevOffer" aria-label="Previous offer">‹</button> <button class="chip" id="nextOffer" aria-label="Next offer">›</button></span></div>`:'')

        pickupName:shortName(o.pickup_name), dropName:shortName(o.drop_name), acceptLabel:`Accept · ${pkr(e.net)} net` });

function ring(v){

/* ---------- Panel dispatcher + events ---------- */
function renderPanel(){
  let html;
  if(S.view==='auth') html = authPanel();
  else if(S.view==='driverForm') html = driverForm();
  else if(S.view==='account') html = accountPanel();
  else if(S.mode==='driver') html = S.backend && S.driver ? driverLive() : driverDemo();
  else if(S.backend && S.ride) html = riderLive();
  else if(S.backend && S.rideEnded) html = riderEnded();
  else html = riderPlanner();
  $('#panel').innerHTML = html;
  bindPanel();
}
function on(id, ev, fn){ const el=$('#'+id); if(el) el['on'+ev]=fn; }
function bindPanel(){
  // planner
  wireAuto('from','sug', p=>pickTrip('from',p), ()=>S.from.name);
  wireAuto('to','sug', p=>pickTrip('to',p), ()=>S.to.name);
  on('locate','click',useMyLocation);
  $('#panel').querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{S.type=b.dataset.type;S.offer=null;render();});
  $('#panel').querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{S.route=b.dataset.route;S.offer=null;render();});
  on('dl','change',e=>{S.deadline=e.target.value||DEFAULT_DEADLINE;render();});
  const fair = ROUTES.length ? fairFare() : 0;
  on('minus','click',()=>{S.offer=Math.max(L.roundFare(fair*.6),(S.offer??fair)-L.fareStep);render();});
  on('plus','click',()=>{S.offer=Math.min(L.roundFare(fair*1.6),(S.offer??fair)+L.fareStep);render();});
  on('resetFare','click',()=>{S.offer=null;render();});
  on('request','click',requestRide);
  on('cancelDemo','click',()=>{S.requested=false;render();toast('Request cancelled. No fee.');});
  on('becomeDriver','click',()=>{S.view='driverForm';render();});
  // live rider
  on('cancelRide','click',()=>cancelRide(S.ride.id));
  on('newRide','click',()=>{S.rideEnded=null;render();});
  updateRideEta();
  // driver
  on('onlineBtn','click',()=>S.online?stopOnline():goOnline());
  on('prevOffer','click',()=>{S.offerIdx=(S.offerIdx-1+S.offers.length)%S.offers.length;render();});
  on('nextOffer','click',()=>{S.offerIdx=(S.offerIdx+1)%S.offers.length;render();});
  on('accept','click',()=>{ if(S.backend && S.driver) acceptOffer(S.offers[S.offerIdx]); else { S.accepted=true; render(); toast(`Accepted. Navigating via ${route().name}.`); } });
  on('decline','click',()=>{ if(S.backend && S.driver){ S.declined.add(S.offers[S.offerIdx].id); S.offers.splice(S.offerIdx,1); S.offerIdx=0; render(); } else { S.timer=0; render(); } toast('Declined. No effect on your rating.'); });
  on('again','click',()=>{S.timer=45;render();});
  on('finishDemo','click',()=>{const e=econ();S.earned+=Math.round(e.net);S.driven+=e.mins;S.accepted=false;S.timer=45;render();toast(`Trip complete. ${pkr(e.net)} added to today.`);});
  on('jobNext','click',e=>jobStep(e.currentTarget.dataset.status));
  on('jobCancel','click',()=>jobStep('cancelled'));

  const num = (id,key,conv)=>{const el=$(id); el && (el.onchange=ev=>{const v=parseFloat(ev.target.value); if(v>0){S[key]=conv(v);render();const d=$('details'); d&&(d.open=true);}});};
  num('#petrol','petrol',L.fuelPriceToLitre); num('#kmpl','kmpl',L.economyToKmpl);

  on('authBack','click',()=>{S.authStep='email';render();});
  on('authClose','click',()=>{S.view=null;S.afterAuth=null;render();});

}
function renderHeader(){

}
function render(){ renderHeader(); renderPanel(); renderMap(); }

/* =========================================================
   MUSAAFIR GPS — turn-by-turn navigation with a male voice
   ========================================================= */
const Voice = {
  on:true, voice:null,
  MALE:/(male|david|daniel|alex\b|fred|george|guy|james|mark|rishi|aaron|arthur|ravi|thomas|oliver|ryan|matthew|brian|christopher|eric|roger|andrew|prabhat|asad|salman|uzair)/i,
  FEMALE:/(female|zira|samantha|victoria|karen|susan|hazel|heera|moira|tessa|fiona|serena|aria|jenny|libby|sonia|natasha|catherine|kate|veena|neerja|uzma|gul|emma|ava|allison|zoe|nicky)/i,
  pick(){
    if(!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
    const pref = l => vs.filter(v=>v.lang.replace('_','-').toLowerCase().startsWith(l));
    const pool = [...L.voiceLangs.flatMap(pref), ...vs];
    this.voice = pool.find(v=>this.MALE.test(v.name)&&!this.FEMALE.test(v.name)) || pool.find(v=>!this.FEMALE.test(v.name)) || pool[0] || null;
  },
  say(text){
    if(!this.on || !('speechSynthesis' in window) || !text) return;
    if(!this.voice) this.pick();
    const u = new SpeechSynthesisUtterance(text);
    if(this.voice){ u.voice = this.voice; u.lang = this.voice.lang; }
    u.rate = 1; u.pitch = this.voice && this.MALE.test(this.voice.name) ? 1 : 0.8;   // lower pitch if no male voice is installed
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  },
};
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged = ()=>Voice.pick();

const N = { open:false, active:false, dest:null, pref:'safe', steps:[], idx:0, path:[], map:null, line:null, me:null, watch:null, pos:null, heading:0,
  totalM:0, startedAt:0, said:{}, offCount:0, rerouting:false, sim:null, lastBreakWarn:0, eta:null };

function maneuverSvg(m){
  m = (m||'').toUpperCase();
  const arrow = (d)=>`<svg viewBox="0 0 48 48" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  if(m.includes('UTURN')) return arrow('M30 40V18a8 8 0 0 0-16 0v6M8 18l6 7 6-7');
  if(m.includes('ROUNDABOUT')) return arrow('M24 42V30M24 30a8 8 0 1 1 8-8M32 22h8M36 16l6 6-6 6');
  if(m.includes('SLIGHT_LEFT')||m.includes('KEEP_LEFT')||m==='FORK_LEFT'||m==='RAMP_LEFT') return arrow('M28 42V26L16 12M16 12v10M16 12h10');
  if(m.includes('SLIGHT_RIGHT')||m.includes('KEEP_RIGHT')||m==='FORK_RIGHT'||m==='RAMP_RIGHT') return arrow('M20 42V26L32 12M32 12v10M32 12H22');
  if(m.includes('LEFT')) return arrow('M30 42V22H12M18 15l-7 7 7 7');
  if(m.includes('RIGHT')) return arrow('M18 42V22h18M30 15l7 7-7 7');
  if(m==='ARRIVE') return `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 44s14-13 14-24a14 14 0 0 0-28 0c0 11 14 24 14 24Z" fill="currentColor"/><circle cx="24" cy="20" r="5" fill="#0B1220"/></svg>`;
  return arrow('M24 42V8M14 18l10-10 10 10');
}
const fmtDist = m => L.navDist(m);
const sayDist = m => L.navSay(m);
const lc = s => s ? s.charAt(0).toLowerCase()+s.slice(1) : s;

function openGps(dest){
  N.open = true; $('#nav').hidden = false; document.body.classList.add('nav-open');
  $('#navSetup').hidden = false; $('#navRun').hidden = true;
  $('#navDest').value = dest?.name || '';
  N.dest = dest || null;
  $('#navStart').disabled = !N.dest;
  $('#navSetupNote').textContent = G ? `${L.brand} GPS uses your phone's location and Google live traffic.` : 'Demo drive: add your Google key on your website for real turn-by-turn navigation.';
  if(!G && !N.dest){ N.dest = PLACES[1]; $('#navDest').value = N.dest.name; $('#navStart').disabled = false; }
  Voice.pick();
  setTimeout(()=>$('#navDest').focus(), 50);
}
function closeGps(){
  stopNav(); exitCarMode(); N.open=false; $('#nav').hidden = true; document.body.classList.remove('nav-open');
}
function stopNav(){
  if(N.watch!==null){ navigator.geolocation.clearWatch(N.watch); N.watch=null; }
  clearInterval(N.sim); N.sim=null; N.active=false;
  if('speechSynthesis' in window) speechSynthesis.cancel();
  releaseWake();
}
let wakeLock=null;
async function keepAwake(){ try{ wakeLock = await navigator.wakeLock?.request('screen'); }catch(e){} }
function releaseWake(){ try{ wakeLock?.release(); }catch(e){} wakeLock=null; }

async function startNav(){
  if(!N.dest) return;
  carMode();
  $('#navSetup').hidden = true; $('#navRun').hidden = false;
  N.said = {}; N.offCount = 0; N.startedAt = Date.now(); N.lastBreakWarn = Date.now();
  keepAwake();
  if(!G) return startDemoNav();
  setNavText('Finding your location…', '', 'STRAIGHT', '');
  try{ N.pos = await getPosition(); }catch(e){ setNavText(e.message, '', 'STRAIGHT', ''); Voice.say('I need your location to navigate.'); return; }
  if(!N.map){
    const { Map } = await google.maps.importLibrary('maps');
    N.map = new Map($('#navMap'), { center:N.pos, zoom:17, disableDefaultUI:true, clickableIcons:false, gestureHandling:'greedy',
      styles:[{elementType:'geometry',stylers:[{color:'#16202f'}]},{elementType:'labels.text.fill',stylers:[{color:'#9fb0c6'}]},{elementType:'labels.text.stroke',stylers:[{color:'#0b1220'}]},
              {featureType:'road',elementType:'geometry',stylers:[{color:'#2a3850'}]},{featureType:'road.highway',elementType:'geometry',stylers:[{color:'#3b4b66'}]},
              {featureType:'water',elementType:'geometry',stylers:[{color:'#0c2a36'}]},{featureType:'poi',stylers:[{visibility:'off'}]}] });
    new google.maps.TrafficLayer().setMap(N.map);
  }
  await routeNav(N.pos, true);
  N.watch = navigator.geolocation.watchPosition(onNavPos, err=>{ if(err.code===1){ setNavText('Location access was blocked','Allow location in your browser settings to keep navigating.','STRAIGHT',''); } },
    { enableHighAccuracy:true, maximumAge:1000, timeout:20000 });
}
async function routeNav(from, first){
  N.rerouting = true;
  try{
    const routes = await googleCompute(from, { lat:N.dest.lat, lng:N.dest.lng }, ['legs']);
    if(!routes.length) throw new Error('No driving route found');
    const profiled = profileRoutes(routes);
    const chosen = (profiled.find(r=>r.id===N.pref) || profiled[0]).g;
    N.steps = [];
    (chosen.legs||[]).forEach(leg=>(leg.steps||[]).forEach(s=>{
      const path = (s.path||[]).map(ll);
      if(path.length) N.steps.push({ text:s.instructions || '', man:s.maneuver || 'STRAIGHT', dist:s.distanceMeters||0, end:path[path.length-1], path });
    }));
    N.steps.push({ text:`Arrive at ${N.dest.name}`, man:'ARRIVE', dist:0, end:{lat:N.dest.lat,lng:N.dest.lng}, path:[{lat:N.dest.lat,lng:N.dest.lng}] });
    N.path = (chosen.path||[]).map(ll); N.idx = 0; N.said = {};
    N.totalM = chosen.distanceMeters; N.eta = new Date(Date.now()+(chosen.durationMillis||0));
    if(N.line) N.line.setMap(null);
    N.line = new google.maps.Polyline({ map:N.map, path:N.path, strokeColor:'#2ED8B2', strokeWeight:8, strokeOpacity:.95 });
    if(!N.me) N.me = new google.maps.Marker({ map:N.map, position:from, icon:carIcon(0,'#FFA43A'), zIndex:9 });
    N.active = true;
    const pt = PROFILES[N.pref].tag.toLowerCase();
    if(first) Voice.say(`Starting ${L.brand} navigation to ${N.dest.name}, on the ${pt} route. ${lc(N.steps[0]?.text||'')}`);
    else Voice.say('Route updated.');
    onNavPos({ coords:{ latitude:from.lat, longitude:from.lng, heading:null } });
  }catch(e){
    console.error(e); setNavText('Couldn\'t find a route', (e?.message||'').slice(0,120), 'STRAIGHT', ''); Voice.say('Sorry, I could not find a route.');
  }
  N.rerouting = false;
}
function distToPath(p, path){ let best=Infinity; for(let i=0;i<path.length;i++){ const d=haversine(p,path[i])*1000; if(d<best) best=d; } return best; }
function onNavPos(p){
  if(!N.active) return;
  const pos = { lat:p.coords.latitude, lng:p.coords.longitude };
  const moved = N.pos ? haversine(N.pos,pos)*1000 : 0;
  const heading = Number.isFinite(p.coords.heading) ? p.coords.heading : (moved>4 ? bearing(N.pos,pos) : N.heading);
  N.pos = pos; N.heading = heading;
  if(N.me){ N.me.setIcon(carIcon(heading,'#FFA43A')); animateMarker(N.me, pos, 700); }
  if(N.map){ N.map.panTo(pos); if(typeof N.map.setHeading==='function') try{ N.map.setHeading(heading); }catch(e){} }
  // advance steps we've passed
  while(N.idx < N.steps.length-1 && haversine(pos, N.steps[N.idx].end)*1000 < 25) N.idx++;
  const step = N.steps[N.idx]; if(!step) return;
  const toEnd = haversine(pos, step.end)*1000;
  const next = N.steps[N.idx+1];
  // off-route check
  const off = distToPath(pos, N.steps.slice(N.idx, N.idx+3).flatMap(s=>s.path));
  N.offCount = off > 60 ? N.offCount+1 : 0;
  if(N.offCount>=3 && !N.rerouting){ N.offCount=0; setNavText('Rerouting…','', 'STRAIGHT',''); Voice.say('Rerouting.'); routeNav(pos,false); return; }
  // arrival
  if(step.man==='ARRIVE' || (!next && toEnd<30)){
    if(haversine(pos,{lat:N.dest.lat,lng:N.dest.lng})*1000 < 40){ arrived(); return; }
  }
  // what to show: the upcoming manoeuvre is the next step's instruction
  const upcoming = next || step;
  setNavText(fmtDist(toEnd), upcoming.text, upcoming.man, next && N.steps[N.idx+2] ? `Then: ${N.steps[N.idx+2].text}` : '');
  // voice prompts: far (~800 m on long steps), near (300 m), now (60 m)
  const k = N.idx;
  if(toEnd>600 && toEnd<900 && !N.said[k+'f']){ N.said[k+'f']=1; Voice.say(`In ${sayDist(toEnd)}, ${lc(upcoming.text)}`); }
  else if(toEnd<=320 && toEnd>90 && !N.said[k+'n']){ N.said[k+'n']=1; Voice.say(`In ${sayDist(toEnd)}, ${lc(upcoming.text)}`); }
  else if(toEnd<=60 && !N.said[k+'x']){ N.said[k+'x']=1; Voice.say(upcoming.text); }
  // remaining
  let remM = toEnd; for(let i=N.idx+1;i<N.steps.length;i++) remM += N.steps[i].dist;
  const ratio = N.totalM ? remM/N.totalM : 0;
  const totalMs = N.eta ? Math.max(0, N.eta - N.startedAt) : 0;
  const remMin = Math.max(1, Math.round(totalMs*ratio/60000));
  updateNavBottom(remM, remMin);
  fatigueNudge();
}
function fatigueNudge(){
  const drivingMin = (Date.now()-N.startedAt)/60000;
  if(drivingMin>=120 && Date.now()-N.lastBreakWarn > 30*60000){
    N.lastBreakWarn = Date.now();
    Voice.say(`You have been driving for two hours. ${L.brand} suggests a short break at the next safe stop.`);
    toast('2 hours of driving. Take a short break when it\'s safe.');
  }
}
function arrived(){
  N.active = false;
  setNavText('You have arrived', N.dest.name, 'ARRIVE', '');
  updateNavBottom(0, 0);
  Voice.say(`You have arrived at ${N.dest.name}. Thank you for driving with ${L.brand}.`);
  if(N.watch!==null){ navigator.geolocation.clearWatch(N.watch); N.watch=null; }
  clearInterval(N.sim); N.sim=null; releaseWake();
}
function setNavText(dist, text, man, next){
  $('#navIcon').innerHTML = maneuverSvg(man);
  $('#navDist').textContent = dist;
  $('#navText').textContent = text;
  $('#navNext').textContent = next || '';
  $('#navNext').hidden = !next;
}
function updateNavBottom(remM, remMin){
  $('#navEta').textContent = remMin ? clock(remMin) : 'Arrived';
  $('#navRem').textContent = remMin ? `${remMin} min · ${fmtDist(remM)}` : N.dest?.name || '';
}
// Demo drive for the preview (no Google): simulated steps along the drawn map
const DEMO_STEPS = L.demoSteps || [
  { text:'Head north towards the main road', man:'DEPART', dist:450 },
  { text:'Turn right onto the boulevard', man:'TURN_RIGHT', dist:1800 },
  { text:'At the roundabout, take the second exit', man:'ROUNDABOUT_RIGHT', dist:5200 },
  { text:'Keep left to stay on the main road', man:'KEEP_LEFT', dist:3400 },
  { text:'Turn left onto the airport road', man:'TURN_LEFT', dist:4100 },
  { text:'Turn right towards the terminal', man:'TURN_RIGHT', dist:1600 },
  { text:'Arrive at your destination', man:'ARRIVE', dist:0 },
];
function startDemoNav(){
  $('#navMap').innerHTML = `<svg viewBox="0 0 600 500" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block">
    <rect width="600" height="500" fill="#16202f"/>
    ${Array.from({length:11},(_,i)=>`<line x1="${i*60}" y1="0" x2="${i*60}" y2="500" stroke="#2a3850" stroke-width="6"/>`).join('')}
    ${Array.from({length:11},(_,i)=>`<line x1="0" y1="${i*50}" x2="600" y2="${i*50}" stroke="#2a3850" stroke-width="6"/>`).join('')}
    <path id="demoNavPath" d="${DEMO_SHAPES.safe}" fill="none" stroke="#2ED8B2" stroke-width="9" stroke-linecap="round"/>
    <path id="demoCar" d="M0,-14 L9,10 L0,5 L-9,10 Z" fill="#FFA43A" stroke="#fff" stroke-width="2"/></svg>`;
  N.steps = DEMO_STEPS.map(s=>({...s})); N.idx = 0; N.active = true;
  const total = N.steps.reduce((s,x)=>s+x.dist,0);
  const pathEl = $('#demoNavPath'), car = $('#demoCar'), L = pathEl.getTotalLength();
  let t = 0; const per = 28;   // ticks per step
  Voice.say(`Starting ${L.brand} navigation to ${N.dest.name}. This is a demo drive. ${lc(N.steps[1].text)}`);
  N.sim = setInterval(()=>{
    if(!N.active) return;
    const stepT = t % per, idx = Math.floor(t/per);
    if(idx >= N.steps.length-1){ car.setAttribute('transform', placeAt(L)); return arrived(); }
    N.idx = idx;
    const step = N.steps[idx], next = N.steps[idx+1];
    const left = step.dist*(1-stepT/per);
    setNavText(fmtDist(left), next.text, next.man, N.steps[idx+2] ? `Then: ${N.steps[idx+2].text}` : '');
    if(stepT===Math.floor(per*.45)) Voice.say(`In ${sayDist(left)}, ${lc(next.text)}`);
    if(stepT===per-3) Voice.say(next.text);
    const done = N.steps.slice(0,idx).reduce((s,x)=>s+x.dist,0) + step.dist*stepT/per;
    car.setAttribute('transform', placeAt(L*done/total));
    const remM = total-done; updateNavBottom(remM, Math.max(1, Math.round(remM/1000*2)));
    t++;
  }, 250);
  function placeAt(len){ const p = pathEl.getPointAtLength(len), q = pathEl.getPointAtLength(Math.min(L,len+2)); const a = Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI+90; return `translate(${p.x} ${p.y}) rotate(${a})`; }
}
function leaveGpsOnly(){
  if(!GPS_ONLY) return;
  if(window.opener){ try{ window.close(); return; }catch(e){} }
  if(window.matchMedia('(display-mode: standalone)').matches){ openGps(null); return; }   // installed app: stay in GPS
  location.href = L.homeUrl;
}
// Phones: go full screen and hold portrait while navigating (Android; iPhone ignores it)
async function carMode(){
  if(!window.matchMedia('(pointer: coarse)').matches) return;
  try{ if(!document.fullscreenElement && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen({ navigationUI:'hide' }); }catch(e){}
  try{ await screen.orientation?.lock?.('portrait'); }catch(e){}
}
function exitCarMode(){ try{ screen.orientation?.unlock?.(); }catch(e){} try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){} }
// "Install as an app" for GPS-only visitors
let installEvt = null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); installEvt = e; const b=$('#navInstall'); if(b && GPS_ONLY) b.hidden=false; });
function showInstallHint(){
  if(!GPS_ONLY || window.matchMedia('(display-mode: standalone)').matches) return;
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)) $('#navInstallTip').hidden = false;
  if(installEvt) $('#navInstall').hidden = false;
}
function bindGps(){
  $('#navInstall').onclick = async ()=>{ if(!installEvt) return; installEvt.prompt(); const r = await installEvt.userChoice; if(r.outcome==='accepted') toast(`${L.brand} GPS added to your home screen`); installEvt=null; $('#navInstall').hidden=true; };
  $('#gpsBtn').onclick = ()=>openGps(null);
  $('#navClose').onclick = ()=>{ closeGps(); leaveGpsOnly(); };
  $('#navEnd').onclick = ()=>{ closeGps(); toast('Navigation ended'); if(GPS_ONLY) openGps(null); };
  $('#navStart').onclick = startNav;
  $('#navMute').onclick = e=>{ Voice.on=!Voice.on; e.currentTarget.setAttribute('aria-pressed', !Voice.on); e.currentTarget.textContent = Voice.on?'Voice on':'Muted'; if(!Voice.on && 'speechSynthesis' in window) speechSynthesis.cancel(); };
  $('#navTest').onclick = ()=>Voice.say(L.voiceHello);
  document.querySelectorAll('[data-pref]').forEach(b=>b.onclick=()=>{ N.pref=b.dataset.pref; document.querySelectorAll('[data-pref]').forEach(x=>x.setAttribute('aria-pressed', x===b)); });
  wireAuto('navDest','navSug', p=>{ N.dest=p; $('#navStart').disabled=false; }, ()=>N.dest?.name ?? '');
  $('#navHere').onclick = async ()=>{ try{ S.here = await getPosition(); toast('Location found. Choose where you\'re going.'); }catch(e){ toast(e.message); } };
}

/* =========================================================
   GOOGLE LOADER + STARTUP
   ========================================================= */
window.gm_authFailure = () => toast('Google Maps rejected the API key. Check the key and its website restrictions.');
async function loadGoogle(){
  if(!GOOGLE_MAPS_KEY) return;
  try{
    await new Promise((res,rej)=>{
      window.__musaafirMaps = res;
      const s = document.createElement('script');
      s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(GOOGLE_MAPS_KEY)}&v=weekly&loading=async&callback=__musaafirMaps`;
      s.async = true; s.onerror = rej; document.head.appendChild(s);
      setTimeout(()=>rej(new Error('timeout')), 10000);
    });
    const [{ Map }, { AutocompleteSuggestion, AutocompleteSessionToken }, { Route }] = await Promise.all([
      google.maps.importLibrary('maps'), google.maps.importLibrary('places'), google.maps.importLibrary('routes') ]);
    $('#gmap').hidden = false; $('#map').hidden = true;
    const map = new Map($('#gmap'), { center:{lat:S.from.lat,lng:S.from.lng}, zoom:12, disableDefaultUI:true, zoomControl:true, clickableIcons:false });
    G = { trafficLayer:new google.maps.TrafficLayer(), map, AutocompleteSuggestion, AutocompleteSessionToken, Route, lines:[], marks:[], token:null, fit:true };
    try{ navigator.permissions?.query({name:'geolocation'}).then(p=>{ if(p.state==='granted') getPosition().then(pos=>{ S.here=pos; }).catch(()=>{}); }); }catch(e){}
    await computeRoutes(); render();
  }catch(err){
    console.error('Google Maps failed to load:', err);
    G = null; $('#gmap').hidden = true; $('#map').hidden = false;
    toast('Google Maps couldn\'t load. Showing the demo map.');
  }
}
['rider','driver'].forEach(m=>$('#m-'+m).onclick=()=>{ S.mode=m; S.view=null; if(G) G.fit=true; render(); });
$('#acctBtn').onclick = ()=>{ S.view = S.user && S.profile ? 'account' : 'auth'; if(!S.user) S.authStep='email'; render(); };
$('#nightBtn').onclick=e=>{S.night=!S.night;e.currentTarget.setAttribute('aria-pressed',S.night);render();};
$('#trafficBtn').onclick=e=>{S.traffic=!S.traffic;e.currentTarget.setAttribute('aria-pressed',S.traffic);render();};
$('#riskBtn').onclick=e=>{S.hazards=!S.hazards;e.currentTarget.setAttribute('aria-pressed',S.hazards);render();};
setInterval(()=>{ if(S.backend || S.mode!=='driver'||S.accepted||S.timer<=0||S.view) return; S.timer--; const t=$('#timer'); if(S.timer<=0) render(); else if(t) t.textContent='0:'+String(S.timer).padStart(2,'0'); },1000);
document.querySelectorAll('.gps-mark').forEach(img=>{ img.src = $('.brand-mark').src; });
const GPS_ONLY = location.hash === '#gps';
bindGps();
ROUTES = demoRoutes();
render();
if(GPS_ONLY){ openGps(null); showInstallHint(); try{ navigator.serviceWorker?.register('sw.js').catch(()=>{}); }catch(e){} }
loadGoogle();
initBackend();
