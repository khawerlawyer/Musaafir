<style>
/* Layout: a living night map fills the screen (roads, towns, a city skyline, moving car lights); one centred column floats above it.
   Single dark look by design, matching the logo's navy. */
:root{ --bg:#070C17; --panel:rgba(14,22,38,.72); --line:rgba(120,150,190,.22); --ink:#EEF2F8; --muted:#A3B0C4;
  --teal:#2ED8B2; --mint:#7CF5D6; --orange:#FFA43A; --gold:#FFD27A; --pink:#FF6B8B;
  --font-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif; --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; color-scheme:dark }
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;overflow-x:hidden}
*{box-sizing:border-box}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 60% 55% at 50% 42%, rgba(7,12,23,.78) 0%, rgba(7,12,23,.35) 55%, rgba(7,12,23,0) 80%)}
.wrap{position:relative;z-index:2;max-width:640px;margin:0 auto;padding-inline:16px;padding-block:22px 44px;display:flex;flex-direction:column;align-items:center;gap:24px;text-align:center}

/* "Product of ARK Group" */
.ark{font-size:11.5px;font-weight:800;letter-spacing:.32em;text-transform:uppercase;
  background:linear-gradient(90deg,var(--teal),var(--gold),var(--orange),var(--pink),var(--teal));background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;padding:6px 14px;border:1px solid var(--line);border-radius:999px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);background-color:transparent}
.ark-wrap{position:relative;border-radius:999px;background:rgba(10,16,30,.55)}

.logo{position:relative;width:min(74vw,330px);aspect-ratio:1;border-radius:24%;overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,255,255,.06),0 24px 80px rgba(46,216,178,.22),0 10px 60px rgba(255,164,58,.14)}
.logo img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.04)}
.logo::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.13) 50%,transparent 65%);background-size:250% 100%;background-position:150% 0;pointer-events:none}

/* GPS button: rotating gradient ring + glow */
.gps{position:relative;width:100%;display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);padding:17px 18px;border-radius:20px;isolation:isolate;text-align:left;overflow:hidden}
.gps::before{content:"";position:absolute;inset:-60%;z-index:-2;background:conic-gradient(from 0deg,var(--teal),var(--gold),var(--orange),var(--pink),var(--teal))}
.gps::after{content:"";position:absolute;inset:2px;border-radius:18px;z-index:-1;background:linear-gradient(135deg,rgba(12,22,38,.96),rgba(16,30,44,.96))}
.gps .ico{position:relative;width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,var(--mint),var(--teal) 55%,#0A8A72);color:#03231C;box-shadow:0 0 0 0 rgba(46,216,178,.6)}
.gps b{display:block;font-family:var(--font-display);font-size:21px;letter-spacing:-.01em}
.gps .sub{color:var(--muted);font-size:14px}
.gps .go{margin-left:auto;font-size:24px;font-weight:800;color:var(--orange)}
.glow{position:absolute;width:100%;height:100%;inset:0;border-radius:22px;z-index:-3;filter:blur(18px);opacity:.55;background:linear-gradient(90deg,var(--teal),var(--orange))}
.gps-shell{position:relative;width:100%}
.gps:hover .go,.gps:focus-visible .go{transform:translateX(4px)}

.label{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:-10px}
.countries{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:440px){ .countries{grid-template-columns:1fr} }
.country{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:18px;border-radius:20px;background:var(--panel);
  border:1.5px solid var(--line);text-decoration:none;color:var(--ink);text-align:left;min-width:0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.country::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.10) 50%,transparent 70%);background-size:250% 100%;background-position:150% 0;pointer-events:none}
.country.pk{--c:var(--teal)} .country.us{--c:var(--orange)}
.country:hover,.country:focus-visible{border-color:var(--c);box-shadow:0 14px 40px -12px var(--c)}
.country svg{width:56px;height:37px;border-radius:6px;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.country b{font-family:var(--font-display);font-size:23px;letter-spacing:-.01em}
.country .meta{color:var(--muted);font-size:13.5px}
.country .enter{margin-top:4px;font-size:13px;font-weight:800;color:var(--c);letter-spacing:.02em}
.foot{color:var(--muted);font-size:13px;margin:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

@media (prefers-reduced-motion: no-preference){
  .ark{animation:flow 6s linear infinite}
  @keyframes flow{to{background-position:300% 0}}
  .gps::before{animation:spin 4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .glow{animation:breathe 3.2s ease-in-out infinite}
  @keyframes breathe{50%{opacity:.9;transform:scale(1.02)}}
  .gps .ico{animation:ping 2.4s ease-out infinite}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(46,216,178,.55)}80%,100%{box-shadow:0 0 0 16px rgba(46,216,178,0)}}
  .gps .go{transition:transform .2s}
  .logo::after{animation:sheen 7s ease-in-out infinite}
  @keyframes sheen{0%,70%{background-position:150% 0}100%{background-position:-50% 0}}
  .country{transition:transform .25s,border-color .25s,box-shadow .25s}
  .country:hover,.country:focus-visible{transform:translateY(-4px)}
  .country:hover::before,.country:focus-visible::before{animation:sheen .9s ease-out}
  .rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
  .rise:nth-child(2){animation-delay:.08s}.rise:nth-child(3){animation-delay:.16s}.rise:nth-child(4){animation-delay:.24s}.rise:nth-child(5){animation-delay:.32s}.rise:nth-child(6){animation-delay:.4s}
  @keyframes rise{from{transform:translateY(14px)}to{transform:none}}
}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>

<script>
// GPS shortcut: on a computer it opens as its own tall, phone-shaped window; on phones it opens full screen.
(function(){
  var gps = document.getElementById('gpsLink');
  gps.addEventListener('click', function(e){
    if(window.matchMedia('(pointer: coarse)').matches) return;
    var w = 420, h = Math.min(900, (screen.availHeight||900) - 40);
    var l = Math.max(0, (screen.availWidth||1280) - w - 40), t = Math.max(0, ((screen.availHeight||900) - h) / 2);
    var win = window.open(gps.href, 'musaafirGPS', 'popup=yes,width='+w+',height='+h+',left='+l+',top='+t);
    if(win){ e.preventDefault(); try{ win.focus(); }catch(err){} }
  });
})();

// ---------- Living night map: roads, towns, a city skyline and moving car lights ----------
(function(){
  const cv = document.getElementById('scene'), ctx = cv.getContext('2d');
  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, dpr, base, roads = [], cars = [], seed = 7;
  const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const lerp = (a,b,t) => a+(b-a)*t;

  function bez(p0,p1,p2,p3,n){ const pts=[]; for(let i=0;i<=n;i++){ const t=i/n,u=1-t;
    pts.push({ x:u*u*u*p0.x+3*u*u*t*p1.x+3*u*t*t*p2.x+t*t*t*p3.x, y:u*u*u*p0.y+3*u*u*t*p1.y+3*u*t*t*p2.y+t*t*t*p3.y }); } return pts; }
  function measure(pts){ let L=0; const acc=[0]; for(let i=1;i<pts.length;i++){ L+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y); acc.push(L); } return { pts, acc, L }; }
  function at(r,d){ d=((d%r.L)+r.L)%r.L; let i=1; while(i<r.acc.length-1 && r.acc[i]<d) i++; const t=(d-r.acc[i-1])/((r.acc[i]-r.acc[i-1])||1);
    return { x:lerp(r.pts[i-1].x,r.pts[i].x,t), y:lerp(r.pts[i-1].y,r.pts[i].y,t) }; }

  function build(){
    dpr = Math.min(2, window.devicePixelRatio||1);
    W = cv.clientWidth; H = cv.clientHeight; cv.width = W*dpr; cv.height = H*dpr;
    seed = 7; roads = []; cars = [];
    base = document.createElement('canvas'); base.width = cv.width; base.height = cv.height;
    const b = base.getContext('2d'); b.scale(dpr,dpr);
    // ground
    const g = b.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0A1424'); g.addColorStop(.6,'#081120'); g.addColorStop(1,'#060A14');
    b.fillStyle = g; b.fillRect(0,0,W,H);
    // river
    b.strokeStyle='rgba(30,90,120,.35)'; b.lineWidth=Math.max(18,W*.03); b.lineCap='round';
    b.beginPath(); b.moveTo(-40,H*.18); b.bezierCurveTo(W*.3,H*.05,W*.45,H*.45,W*1.05,H*.32); b.stroke();
    // town clusters: little street grids with warm lights
    const towns = [[.12,.22],[.86,.16],[.08,.62],[.9,.58],[.5,.12],[.32,.5],[.7,.44]].map(([x,y])=>({ x:x*W, y:y*H, r:Math.min(W,H)*(.06+rnd()*.05) }));
    towns.forEach(t=>{
      b.strokeStyle='rgba(120,150,190,.10)'; b.lineWidth=1;
      for(let k=-3;k<=3;k++){ b.beginPath(); b.moveTo(t.x-t.r,t.y+k*t.r/3.5); b.lineTo(t.x+t.r,t.y+k*t.r/3.5); b.stroke(); b.beginPath(); b.moveTo(t.x+k*t.r/3.5,t.y-t.r); b.lineTo(t.x+k*t.r/3.5,t.y+t.r); b.stroke(); }
      const glow = b.createRadialGradient(t.x,t.y,0,t.x,t.y,t.r*1.4); glow.addColorStop(0,'rgba(255,190,110,.16)'); glow.addColorStop(1,'rgba(255,190,110,0)');
      b.fillStyle = glow; b.beginPath(); b.arc(t.x,t.y,t.r*1.4,0,7); b.fill();
      for(let i=0;i<70;i++){ const a=rnd()*6.28, d=Math.sqrt(rnd())*t.r; b.fillStyle = rnd()<.75?'rgba(255,205,140,.75)':'rgba(170,230,255,.7)';
        b.fillRect(t.x+Math.cos(a)*d, t.y+Math.sin(a)*d, rnd()<.2?2:1.2, rnd()<.2?2:1.2); }
    });
    // highways linking towns + a ring road
    const links = [[0,4],[4,1],[0,5],[5,6],[6,1],[2,5],[6,3],[2,3],[4,6],[0,2],[1,3]];
    links.forEach(([i,j])=>{ const A=towns[i], B=towns[j]; const mx=(A.x+B.x)/2, my=(A.y+B.y)/2, off=(rnd()-.5)*Math.min(W,H)*.25;
      roads.push(measure(bez(A,{x:mx+off,y:A.y},{x:mx-off,y:B.y},B,60))); });
    roads.push(measure(bez({x:-60,y:H*.78},{x:W*.3,y:H*.66},{x:W*.7,y:H*.9},{x:W+60,y:H*.72},80)));
    roads.push(measure(bez({x:W*.2,y:-40},{x:W*.25,y:H*.4},{x:W*.05,y:H*.5},{x:-40,y:H*.95},80)));
    roads.push(measure(bez({x:W*.82,y:-40},{x:W*.7,y:H*.35},{x:W*.95,y:H*.55},{x:W+40,y:H*.98},80)));
    roads.forEach(r=>{ b.lineCap='round'; b.lineJoin='round';
      b.strokeStyle='rgba(60,80,110,.55)'; b.lineWidth=5; b.beginPath(); r.pts.forEach((p,k)=>k?b.lineTo(p.x,p.y):b.moveTo(p.x,p.y)); b.stroke();
      b.strokeStyle='rgba(140,170,210,.18)'; b.lineWidth=1; b.setLineDash([6,8]); b.stroke(); b.setLineDash([]); });
    // city skyline along the bottom with lit windows
    const sky = H*.86; let x = -10;
    while(x < W+10){
      const w = 18+rnd()*42, h = (40+rnd()*rnd()*190) * Math.min(1, H/800+.25);
      const top = sky - h + 40;
      const bg = b.createLinearGradient(0,top,0,H); bg.addColorStop(0,'#111C30'); bg.addColorStop(1,'#0A101D');
      b.fillStyle = bg; b.fillRect(x, top, w, H-top);
      for(let wy=top+6; wy<H-8; wy+=7) for(let wx=x+4; wx<x+w-4; wx+=6)
        if(rnd()<.32){ b.fillStyle = rnd()<.8 ? 'rgba(255,206,140,.55)' : 'rgba(150,220,255,.5)'; b.fillRect(wx,wy,2.2,3); }
      if(rnd()<.25){ b.fillStyle='rgba(255,90,90,.8)'; b.fillRect(x+w/2-1, top-6, 2, 2); }
      x += w + 2 + rnd()*6;
    }
    const haze = b.createLinearGradient(0,sky-120,0,H); haze.addColorStop(0,'rgba(46,216,178,0)'); haze.addColorStop(1,'rgba(46,216,178,.07)');
    b.fillStyle = haze; b.fillRect(0,sky-120,W,H);
    // cars: teal headlights one way, orange tail lights the other
    roads.forEach(r=>{ const n = Math.max(2, Math.round(r.L/90)); for(let i=0;i<n;i++) cars.push({ r, d:rnd()*r.L, v:(.5+rnd()*.9)*(rnd()<.5?1:-1) }); });
  }
  function frame(){
    ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(base,0,0); ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.globalCompositeOperation = 'lighter';
    cars.forEach(c=>{
      if(!still) c.d += c.v;
      const p = at(c.r,c.d), q = at(c.r,c.d - c.v*14);
      const col = c.v>0 ? '46,216,178' : '255,164,58';
      const gr = ctx.createLinearGradient(q.x,q.y,p.x,p.y); gr.addColorStop(0,`rgba(${col},0)`); gr.addColorStop(1,`rgba(${col},.9)`);
      ctx.strokeStyle = gr; ctx.lineWidth = 2.4; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(q.x,q.y); ctx.lineTo(p.x,p.y); ctx.stroke();
      ctx.fillStyle = `rgba(${col},1)`; ctx.beginPath(); ctx.arc(p.x,p.y,1.8,0,7); ctx.fill();
    });
    ctx.globalCompositeOperation = 'source-over';
    if(!still) requestAnimationFrame(frame);
  }
  let t; window.addEventListener('resize', ()=>{ clearTimeout(t); t=setTimeout(()=>{ build(); if(still) frame(); }, 150); });
  build(); frame();
})();
</script>
